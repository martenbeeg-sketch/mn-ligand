name: mn-ligand

services:
  alphafast:
    image: alphafast:latest
    build:
      context: ./containers/alphafast
      dockerfile: Dockerfile
      platforms: ["linux/x86_64"]

  structure:
    image: ovolig-structure:latest
    build:
      context: ./containers/structure
      dockerfile: Dockerfile
      platforms: ["linux/x86_64"]

  docking:
    image: ovolig-docking:latest
    build:
      context: ./containers/docking
