[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mn-ligand"
version = "0.0.1"
description = "Standalone Streamlit app for Docker-backed ligand modelling workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "altair",
  "gemmi>=0.7,<0.8",
  "matplotlib",
  "mdtraj",
  "meeko>=0.6.1,<0.7",
  "numpy",
  "openpyxl>=3.1,<4",
  "pandas",
  "pillow",
  "py3Dmol",
  "pyyaml>=6,<7",
  "rdkit",
  "scipy",
  "seaborn",
  "streamlit",
  "typer",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
mn-ligand = "mn_ligand.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mn_ligand*"]

[tool.setuptools.package-data]
"*" = ["*"]
